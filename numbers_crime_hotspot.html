<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number of crimes by hot spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F8FBF6; font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; color: #1F2A2E; }
  .wrap { position: relative; width: 100%; height: 100%; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .grid { stroke: #DCE5DA; stroke-width: 1; stroke-dasharray: 3 5; }
  .baseline { stroke: #9AA5A9; stroke-width: 1; }
  .axis-label { font-size: 13px; fill: #6B7679; }
  .year-label { font-size: 14px; fill: #3F4A4D; }
  .axis-title { font-size: 12px; font-weight: 600; fill: #6B7679; }
  .line { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; transition: opacity 0.15s; }
  .dot { cursor: pointer; stroke: #FFFFFF; stroke-width: 2.5; transition: opacity 0.15s; }
  .dot:focus { outline: none; }
  svg.dim .line, svg.dim .dot { opacity: 0.18; }
  svg.dim .line.on, svg.dim .dot.on { opacity: 1; }
  .tip {
    position: absolute; pointer-events: none; background: #1F2A2E; color: #FFFFFF;
    border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.4;
    box-shadow: 0 8px 24px rgba(31,42,46,0.18); opacity: 0; transition: opacity 0.12s; white-space: nowrap; z-index: 2;
  }
  .tip.show { opacity: 1; }
  .tip .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .tip .name i { width: 10px; height: 10px; border-radius: 50%; }
  .tip .val { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .tip .val small { font-size: 13px; font-weight: 400; color: #C5CED1; margin-left: 4px; }
  .tip .meta { font-size: 13px; color: #C5CED1; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="chart" role="img" aria-label="Line chart of number of crimes by hot spot, 2020 to 2025"></svg>
  <div class="tip" id="tip" role="status" aria-live="polite"></div>
</div>

<script>
// ===== EDIT YOUR DATA HERE =====
const years = ['2020', '2021', '2022', '2023', '2024', '2025'];
const series = [
  { name: 'Stone Mill Run', color: '#3B5BDB', values: [183, 186, 198, 240, 211, 214] },
  { name: 'Snapfinger',     color: '#2F9E44', values: [94, 139, 126, 140, 161, 155] },
  { name: 'Panthersville',  color: '#E8590C', values: [241, 304, 293, 279, 211, 214] },
  { name: 'Belvedere',      color: '#C2255C', values: [187, 189, 193, 124, 147, 146] }
];
const yMin = 50, yMax = 350, yStep = 50;
// ================================

const svg = document.getElementById('chart');
const tip = document.getElementById('tip');
const wrap = document.querySelector('.wrap');
const NS = 'http://www.w3.org/2000/svg';
let lines = [], dots = [];

function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  svg.appendChild(e);
  return e;
}

function draw() {
  // Size the chart to whatever space the StoryMap embed gives it
  const W = wrap.clientWidth, H = wrap.clientHeight;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = '';
  lines = []; dots = [];
  const m = { top: 14, right: 24, bottom: 52, left: 62 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const x = i => m.left + i * iw / (years.length - 1);
  const y = v => m.top + ih - ((v - yMin) / (yMax - yMin)) * ih;

  // Bottom line at yMin, then grid lines at every multiple of yStep above it
  el('line', { x1: m.left, x2: W - m.right, y1: y(yMin), y2: y(yMin), class: 'baseline' });
  el('text', { x: m.left - 12, y: y(yMin) + 4, 'text-anchor': 'end', class: 'axis-label' }, yMin);
  for (let v = Math.ceil((yMin + 1) / yStep) * yStep; v <= yMax; v += yStep) {
    el('line', { x1: m.left, x2: W - m.right, y1: y(v), y2: y(v), class: 'grid' });
    el('text', { x: m.left - 12, y: y(v) + 4, 'text-anchor': 'end', class: 'axis-label' }, v);
  }
  years.forEach((yr, i) => el('text', { x: x(i), y: m.top + ih + 24, 'text-anchor': 'middle', class: 'year-label' }, yr));
  el('text', { x: m.left + iw / 2, y: H - 6, 'text-anchor': 'middle', class: 'axis-title' }, 'Year');
  el('text', { x: -(m.top + ih / 2), y: 16, transform: 'rotate(-90)', 'text-anchor': 'middle', class: 'axis-title' }, 'Number of crimes');

  series.forEach(s => {
    const d = s.values.map((v, i) => (i ? 'L' : 'M') + x(i) + ' ' + y(v)).join(' ');
    lines.push(el('path', { d: d, stroke: s.color, class: 'line' }));
  });
  series.forEach((s, k) => s.values.forEach((v, i) => {
    const c = el('circle', { cx: x(i), cy: y(v), r: 6.5, fill: s.color, class: 'dot', tabindex: 0,
      'aria-label': s.name + ', ' + years[i] + ': ' + v + ' crimes' });
    dots.push({ el: c, k: k });
    c.addEventListener('mouseenter', () => showTip(c, i, k));
    c.addEventListener('focus', () => showTip(c, i, k));
    c.addEventListener('click', () => showTip(c, i, k));
    c.addEventListener('mouseleave', hideTip);
    c.addEventListener('blur', hideTip);
  }));
}

function showTip(dot, i, k) {
  const v = series[k].values[i];
  const tied = series.map((o, j) => o.values[i] === v ? j : -1).filter(j => j >= 0);
  let extra = '';
  if (tied.length > 1) extra = '<div class="meta">Same value for ' + tied.length + ' hot spots</div>';
  else if (i > 0) {
    const diff = v - series[k].values[i - 1];
    extra = '<div class="meta">' + (diff > 0 ? '+' : '') + diff + ' from ' + years[i - 1] + '</div>';
  }
  tip.innerHTML = tied.map(j => '<div class="name"><i style="background:' + series[j].color + '"></i>' + series[j].name + '</div>').join('') +
    '<div class="meta">' + years[i] + '</div><div class="val">' + v + '<small>crimes</small></div>' + extra;
  svg.classList.add('dim');
  tied.forEach(j => lines[j].classList.add('on'));
  dots.forEach(d => { if (tied.includes(d.k)) d.el.classList.add('on'); });
  tip.classList.add('show');
  const box = wrap.getBoundingClientRect(), r = dot.getBoundingClientRect();
  let left = r.left - box.left + r.width / 2 - tip.offsetWidth / 2;
  let top = r.top - box.top - tip.offsetHeight - 12;
  left = Math.max(4, Math.min(left, box.width - tip.offsetWidth - 4));
  if (top < 0) top = r.bottom - box.top + 12;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideTip() {
  tip.classList.remove('show');
  svg.classList.remove('dim');
  lines.forEach(l => l.classList.remove('on'));
  dots.forEach(d => d.el.classList.remove('on'));
}

draw();
window.addEventListener('resize', draw);
</script>
</body>
</html>
