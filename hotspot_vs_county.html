<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot spots vs. DeKalb County</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --hot: #E8590C; --county: #A3ADB0; --ink: #1F2A2E; --muted: #5B666A; --line: #DCE2E0; }
  html, body { margin: 0; height: 100%; background: transparent; font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  .wrap { box-sizing: border-box; height: 100%; padding: clamp(16px, 3vh, 32px) clamp(16px, 4vw, 48px); display: flex; flex-direction: column; justify-content: center; gap: clamp(14px, 2.5vh, 26px); max-width: 860px; margin: 0 auto; }
  .key { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; font-weight: 600; }
  .key span { display: inline-flex; align-items: center; gap: 8px; }
  .key i { width: 14px; height: 14px; border-radius: 3px; }
  h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .rows { display: flex; flex-direction: column; gap: clamp(10px, 1.8vh, 18px); }
  .row { display: grid; grid-template-columns: minmax(130px, 34%) 1fr; gap: 16px; align-items: center; }
  .label { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .label small { display: block; font-size: 12.5px; font-weight: 400; color: var(--muted); }
  .bars { display: flex; flex-direction: column; gap: 5px; }
  .bar { display: flex; align-items: center; gap: 8px; }
  .fill { height: 16px; border-radius: 0 4px 4px 0; }
  .fill.hot { background: var(--hot); }
  .fill.county { background: var(--county); }
  .num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .num.county { font-weight: 500; color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: rgba(255,255,255,0.6); }
  .card .t { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .card .big { font-size: 26px; font-weight: 800; color: var(--hot); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .card .vs { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .card .big.word { font-size: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="key" aria-hidden="true">
    <span><i style="background: var(--hot)"></i>Four hot spots</span>
    <span><i style="background: var(--county)"></i>DeKalb County</span>
  </div>

  <section>
    <h2 style="margin-bottom: 12px">Money &amp; housing</h2>
    <div class="rows" id="rows"></div>
  </section>

  <section>
    <h2 style="margin-bottom: 12px">Who lives there</h2>
    <div class="cards">
      <div class="card">
        <div class="t">Median household income</div>
        <div class="big word">Lower</div>
        <div class="vs">than the county</div>
      </div>
      <div class="card">
        <div class="t">People per square mile</div>
        <div class="big">3,535</div>
        <div class="vs">vs. 2,821 county</div>
      </div>
      <div class="card">
        <div class="t">Median age</div>
        <div class="big">35.1</div>
        <div class="vs">vs. 36.4 county</div>
      </div>
    </div>
  </section>
</div>

<script>
// ===== EDIT YOUR DATA HERE (percentages) =====
const rows = [
  { label: 'Poverty rate',               hot: 22,   county: 14 },
  { label: 'Households receiving SNAP',  note: 'About twice the county rate', hot: 25.9, county: 12.8 },
  { label: 'Homeowners',                 hot: 30,   county: 51 },
  { label: 'Renters',                    hot: 47,   county: 36 },
  { label: 'Empty housing units',        hot: 24,   county: 13 },
  { label: 'Households without a car',   hot: 13,   county: 7 }
];
// =============================================

const max = Math.max(...rows.flatMap(r => [r.hot, r.county]));
document.getElementById('rows').innerHTML = rows.map(r => {
  const w = v => (v / max * 82).toFixed(1) + '%';
  return '<div class="row" role="group" aria-label="' + r.label + ': hot spots ' + r.hot + '%, county ' + r.county + '%">' +
    '<div class="label">' + r.label + (r.note ? '<small>' + r.note + '</small>' : '') + '</div>' +
    '<div class="bars">' +
      '<div class="bar"><div class="fill hot" style="width:' + w(r.hot) + '"></div><span class="num">' + r.hot + '%</span></div>' +
      '<div class="bar"><div class="fill county" style="width:' + w(r.county) + '"></div><span class="num county">' + r.county + '%</span></div>' +
    '</div></div>';
}).join('');
</script>
</body>
</html>
