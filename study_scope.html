<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study scope: years and crimes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: "Calistoga"; src: url("calistoga.woff2") format("woff2"); font-display: swap; }
  :root {
    --ink: #1E2A22; --muted: #5E6B62; --line: #D3DDCC; --paper: #FFFFFF; --green: #2D6A4F;
    /* same colors as the crimes-by-type chart */
    --assault: #1B4332; --robbery: #40916C; --rape: #95D5B2; --murder: #D8F3DC;
  }
  html, body { margin: 0; background: transparent; }
  body { font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  .wrap { box-sizing: border-box; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.25fr); gap: 20px; align-items: stretch; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .kicker { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .big { margin: 0; font-family: "Calistoga", Georgia, serif; font-size: clamp(30px, 4.2vw, 44px); line-height: 1; color: var(--green); }
  .note { margin: 0; font-size: 14px; color: var(--muted); }

  /* timeline */
  .timeline { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); margin-top: 8px; padding-top: 8px; }
  .timeline::before { content: ""; position: absolute; left: calc(100% / 12); right: calc(100% / 12); top: 15px; height: 3px; background: var(--green); border-radius: 2px; }
  .yr { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
  .yr::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; border: 3px solid var(--green); box-sizing: border-box; position: relative; z-index: 1; }

  .join { align-self: center; font-family: "Calistoga", Georgia, serif; font-size: 34px; color: var(--line); }

  /* crimes */
  .crimes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 4px 0 0; padding: 0; list-style: none; }
  .crime { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; font-weight: 600; line-height: 1.25; }
  .crime i { flex: none; width: 22px; height: 22px; border-radius: 5px; border: 1px solid rgba(30, 42, 34, 0.15); }
  .crime small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }

  @media (max-width: 640px) {
    .wrap { grid-template-columns: 1fr; }
    .join { justify-self: center; margin: -8px 0; }
  }
  @media (max-width: 380px) { .crimes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="panel" aria-labelledby="p1">
    <p class="kicker" id="p1">Study period</p>
    <p class="big">2020–2025</p>
    <p class="note">Six years of crime data</p>
    <div class="timeline" aria-hidden="true">
      <span class="yr">2020</span><span class="yr">2021</span><span class="yr">2022</span>
      <span class="yr">2023</span><span class="yr">2024</span><span class="yr">2025</span>
    </div>
  </section>

  <div class="join" aria-hidden="true">+</div>

  <section class="panel" aria-labelledby="p2">
    <p class="kicker" id="p2">Crimes we focus on</p>
    <p class="big">4 violent crimes</p>
    <ul class="crimes">
      <li class="crime"><i style="background: var(--assault)"></i>Aggravated assault</li>
      <li class="crime"><i style="background: var(--robbery)"></i>Robbery</li>
      <li class="crime"><i style="background: var(--rape)"></i>Rape</li>
      <li class="crime"><i style="background: var(--murder)"></i><span>Murder<small>and non-negligent manslaughter</small></span></li>
    </ul>
  </section>
</div>
</body>
</html>
