<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violent crimes by type and hot spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; color: #1F2A2E; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px; position: relative; }
  h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { font-size: 15px; color: #5B666A; margin: 0 0 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
  .legend li { font-size: 14px; font-weight: 500; padding: 6px 12px; border: 1px solid #D9DEE0; border-radius: 999px; display: flex; align-items: center; gap: 8px; }
  .legend span { width: 10px; height: 10px; border-radius: 3px; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .grid { stroke: #DDE2E4; stroke-width: 1; stroke-dasharray: 3 5; }
  .baseline { stroke: #9AA5A9; stroke-width: 1; }
  .axis-label { font-size: 14px; fill: #6B7679; }
  .cat-label { font-size: 15px; font-weight: 600; fill: #1F2A2E; }
  .axis-title { font-size: 13px; font-weight: 600; fill: #6B7679; letter-spacing: 0.02em; }
  .total { font-size: 15px; font-weight: 700; fill: #1F2A2E; }
  .seg { cursor: pointer; stroke: #FFFFFF; stroke-width: 1.5; transition: opacity 0.15s; }
  .seg:focus { outline: none; }
  .seg-label { font-size: 13px; font-weight: 600; pointer-events: none; transition: opacity 0.15s; }
  svg.dim .seg, svg.dim .seg-label { opacity: 0.25; }
  svg.dim .seg.on, svg.dim .seg-label.on { opacity: 1; }
  .tip {
    position: absolute; pointer-events: none; background: #1F2A2E; color: #FFFFFF;
    border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.4;
    box-shadow: 0 8px 24px rgba(31,42,46,0.18); opacity: 0; transform: translateY(4px);
    transition: opacity 0.12s, transform 0.12s; white-space: nowrap;
  }
  .tip.show { opacity: 1; transform: translateY(0); }
  .tip .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .tip .name i { width: 10px; height: 10px; border-radius: 3px; }
  .tip .val { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .tip .val small { font-size: 13px; font-weight: 400; color: #C5CED1; margin-left: 4px; }
  .tip .meta { font-size: 13px; color: #C5CED1; }
  @media (prefers-reduced-motion: reduce) { .tip, .seg, .seg-label { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Violent crimes by type and hot spot</h1>
  <p class="sub">Hover over a segment to see its value.</p>
  <ul class="legend" id="legend"></ul>
  <svg id="chart" viewBox="0 0 960 500" role="img" aria-label="Violent crimes by type and hot spot, stacked column chart"></svg>
  <div class="tip" id="tip" role="status" aria-live="polite"></div>
</div>

<script>
// ===== EDIT YOUR DATA HERE =====
// "groups" are the columns. Each item in "series" is one stacked layer;
// its "values" follow the same order as "groups".
const groups = ['Stone Mill Run', 'Snapfinger', 'Panthersville', 'Belvedere'];
const series = [
  { name: 'Aggravated assault', color: '#1B4332', values: [130, 122, 125, 88] },
  { name: 'Robbery',            color: '#40916C', values: [52, 21, 61, 35] },
  { name: 'Rape',               color: '#95D5B2', text: '#1F2A2E', values: [18, 7, 20, 11] },
  { name: 'Murder & non-negligent manslaughter', color: '#D8F3DC', text: '#1F2A2E', values: [14, 5, 8, 12] }
];
const yTitle = 'Number of crimes';
const unit = 'crimes';
// ================================

const svg = document.getElementById('chart');
const tip = document.getElementById('tip');
const wrap = document.querySelector('.wrap');
const NS = 'http://www.w3.org/2000/svg';
const W = 960, H = 500, m = { top: 30, right: 20, bottom: 56, left: 70 };
const iw = W - m.left - m.right, ih = H - m.top - m.bottom;

const totals = groups.map((_, g) => series.reduce((sum, s) => sum + s.values[g], 0));
const maxTotal = Math.max(...totals);
const rawStep = maxTotal / 5;
const pow = Math.pow(10, Math.floor(Math.log10(rawStep)));
const yStep = [1, 2, 2.5, 5, 10].map(n => n * pow).find(n => n >= rawStep);
const yMax = Math.ceil(maxTotal / yStep) * yStep;

const band = iw / groups.length;
const barW = Math.min(110, band * 0.55);
const xc = g => m.left + band * g + band / 2;
const y = v => m.top + ih - (v / yMax) * ih;

function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  svg.appendChild(e);
  return e;
}

document.getElementById('legend').innerHTML = series
  .map(s => '<li><span style="background:' + s.color + '"></span>' + s.name + '</li>').join('');

for (let v = 0; v <= yMax; v += yStep) {
  el('line', { x1: m.left, x2: W - m.right, y1: y(v), y2: y(v), class: v === 0 ? 'baseline' : 'grid' });
  el('text', { x: m.left - 14, y: y(v) + 5, 'text-anchor': 'end', class: 'axis-label' }, v);
}
groups.forEach((name, g) => {
  el('text', { x: xc(g), y: m.top + ih + 28, 'text-anchor': 'middle', class: 'cat-label' }, name);
});
el('text', { x: -(m.top + ih / 2), y: 18, transform: 'rotate(-90)', 'text-anchor': 'middle', class: 'axis-title' }, yTitle);

const segs = [];
function showTip(rect, g, k) {
  const s = series[k], v = s.values[g];
  const pct = totals[g] ? Math.round(v / totals[g] * 100) : 0;
  tip.innerHTML =
    '<div class="name"><i style="background:' + s.color + '"></i>' + s.name + '</div>' +
    '<div class="meta">' + groups[g] + '</div>' +
    '<div class="val">' + v + '<small>' + unit + '</small></div>' +
    '<div class="meta">' + pct + '% of ' + totals[g] + ' total</div>';
  svg.classList.add('dim');
  segs.forEach(o => { if (o.g === g && o.k === k) { o.el.classList.add('on'); if (o.label) o.label.classList.add('on'); } });
  tip.classList.add('show');
  const box = wrap.getBoundingClientRect();
  const r = rect.getBoundingClientRect();
  let left = r.right - box.left + 12;
  if (left + tip.offsetWidth > box.width - 4) left = r.left - box.left - tip.offsetWidth - 12;
  let top = r.top - box.top + r.height / 2 - tip.offsetHeight / 2;
  top = Math.max(0, Math.min(top, box.height - tip.offsetHeight));
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTip() {
  tip.classList.remove('show');
  svg.classList.remove('dim');
  segs.forEach(o => { o.el.classList.remove('on'); if (o.label) o.label.classList.remove('on'); });
}

groups.forEach((name, g) => {
  let base = 0;
  series.forEach((s, k) => {
    const v = s.values[g];
    if (v <= 0) return;
    const top = y(base + v), h = y(base) - top;
    const rect = el('rect', { x: xc(g) - barW / 2, y: top, width: barW, height: h, fill: s.color, class: 'seg', tabindex: 0,
      'aria-label': name + ', ' + s.name + ': ' + v + ' ' + unit });
    let label = null;
    if (h >= 20) {
      label = el('text', { x: xc(g), y: top + h / 2 + 5, 'text-anchor': 'middle', class: 'seg-label', fill: s.text || '#FFFFFF' }, v);
    }
    segs.push({ el: rect, label: label, g: g, k: k });
    rect.addEventListener('mouseenter', () => showTip(rect, g, k));
    rect.addEventListener('focus', () => showTip(rect, g, k));
    rect.addEventListener('click', () => showTip(rect, g, k));
    rect.addEventListener('mouseleave', hideTip);
    rect.addEventListener('blur', hideTip);
    base += v;
  });
  el('text', { x: xc(g), y: y(totals[g]) - 10, 'text-anchor': 'middle', class: 'total' }, totals[g]);
});
</script>
</body>
</html>
