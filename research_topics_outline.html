<style>
  :root { --green: #2B5219; --green-soft: #EAF3DE; --green-line: #97C459; }
  body { margin: 0; padding: 16px; background: #FFFFFF; font-family: "Calistoga", serif; color: var(--green); }
  .calistoga-regular { font-family: "Calistoga", serif; font-weight: 400; font-style: normal; }
  .grid-b { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .btn-b {
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 120px; padding: 14px 16px; box-sizing: border-box;
    border: 1.5px solid var(--green); border-radius: 10px;
    background: transparent; color: var(--green); text-decoration: none;
    transition: background 0.2s;
  }
  .btn-b .index { font-family: Arial, Helvetica, sans-serif; font-size: 12px; letter-spacing: 1px; opacity: 0.7; }
  .btn-b .title { font-size: 20px; line-height: 1.25; }
  .btn-b:hover { background: var(--green-soft); }
  .btn-b:focus-visible { outline: 3px solid var(--green-line); outline-offset: 3px; }
  @media (max-width: 760px) { .grid-b { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 480px) { .grid-b { grid-template-columns: 1fr; } }
</style>
