<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property class by hot spot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: "Public Sans", "Helvetica Neue", Arial, sans-serif; color: #1F2A2E; }
  .wrap { position: relative; width: 100%; height: 100%; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .grid { stroke: #DDE2E4; stroke-width: 1; stroke-dasharray: 3 5; }
  .baseline { stroke: #9AA5A9; stroke-width: 1; }
  .axis-label { font-size: 13px; fill: #6B7679; }
  .cat-label { font-size: 14px; font-weight: 600; fill: #1F2A2E; }
  .axis-title { font-size: 12px; font-weight: 600; fill: #6B7679; }
  .total { font-size: 14px; font-weight: 700; fill: #1F2A2E; }
  .seg { cursor: pointer; stroke: #FFFFFF; stroke-width: 1.5; transition: opacity 0.15s; }
  .seg:focus { outline: none; }
  .seg-label { font-size: 12px; font-weight: 600; pointer-events: none; transition: opacity 0.15s; }
  svg.dim .seg, svg.dim .seg-label { opacity: 0.25; }
  svg.dim .seg.on, svg.dim .seg-label.on { opacity: 1; }
  .tip {
    position: absolute; pointer-events: none; background: #1F2A2E; color: #FFFFFF;
    border-radius: 8px; padding: 10px 14px; font-size: 14px; line-height: 1.4;
    box-shadow: 0 8px 24px rgba(31,42,46,0.18); opacity: 0; transition: opacity 0.12s; white-space: nowrap; z-index: 2;
  }
  .tip.show { opacity: 1; }
  .tip .name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .tip .name i { width: 10px; height: 10px; border-radius: 3px; }
  .tip .val { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .tip .val small { font-size: 13px; font-weight: 400; color: #C5CED1; margin-left: 4px; }
  .tip .meta { font-size: 13px; color: #C5CED1; }
</style>
</head>
<body>
<div class="wrap">
  <svg id="chart" role="img" aria-label="Property class by hot spot, stacked column chart"></svg>
  <div class="tip" id="tip" role="status" aria-live="polite"></div>
</div>

<script>
// ===== EDIT YOUR DATA HERE =====
const groups = ['Stone Mill Run', 'Snapfinger', 'Panthersville', 'Belvedere'];
const series = [
  { name: 'Commercial (C)',      color: '#EE6A5B', values: [226, 182, 199, 119] },
  { name: 'Residential (R)',     color: '#F7E06B', text: '#1F2A2E', values: [101, 137, 121, 110] },
  { name: 'Exempt property (E)', color: '#8DB56A', text: '#1F2A2E', values: [19, 20, 20, 14] },
  { name: 'Industrial (I)',      color: '#C08AD0', text: '#1F2A2E', values: [3, 5, 4, 1] },
  { name: 'Road',                color: '#858585', values: [51, 49, 45, 52] },
  { name: 'Conservation use',    color: '#5B8DB8', values: [0, 0, 1, 0] }
];
const yTitle = 'Number of parcels';
const unit = 'parcels';
// ================================

const svg = document.getElementById('chart');
const tip = document.getElementById('tip');
const wrap = document.querySelector('.wrap');
const NS = 'http://www.w3.org/2000/svg';
const totals = groups.map((_, g) => series.reduce((sum, s) => sum + s.values[g], 0));
const maxTotal = Math.max(...totals);
const rawStep = maxTotal / 5;
const pow = Math.pow(10, Math.floor(Math.log10(rawStep)));
const yStep = [1, 2, 2.5, 5, 10].map(n => n * pow).find(n => n >= rawStep);
const yMax = Math.ceil(maxTotal / yStep) * yStep;
let segs = [];

function el(tag, attrs, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  svg.appendChild(e);
  return e;
}

function draw() {
  // Size the chart to whatever space the StoryMap embed gives it
  const W = wrap.clientWidth, H = wrap.clientHeight;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.innerHTML = '';
  segs = [];
  const m = { top: 26, right: 16, bottom: 40, left: 62 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const band = iw / groups.length;
  const barW = Math.min(120, band * 0.6);
  const xc = g => m.left + band * g + band / 2;
  const y = v => m.top + ih - (v / yMax) * ih;

  for (let v = 0; v <= yMax; v += yStep) {
    el('line', { x1: m.left, x2: W - m.right, y1: y(v), y2: y(v), class: v === 0 ? 'baseline' : 'grid' });
    el('text', { x: m.left - 12, y: y(v) + 4, 'text-anchor': 'end', class: 'axis-label' }, v);
  }
  groups.forEach((name, g) => el('text', { x: xc(g), y: m.top + ih + 26, 'text-anchor': 'middle', class: 'cat-label' }, name));
  el('text', { x: -(m.top + ih / 2), y: 16, transform: 'rotate(-90)', 'text-anchor': 'middle', class: 'axis-title' }, yTitle);

  groups.forEach((name, g) => {
    let base = 0;
    series.forEach((s, k) => {
      const v = s.values[g];
      if (v <= 0) return;
      const top = y(base + v), h = y(base) - top;
      const rect = el('rect', { x: xc(g) - barW / 2, y: top, width: barW, height: h, fill: s.color, class: 'seg', tabindex: 0,
        'aria-label': name + ', ' + s.name + ': ' + v + ' ' + unit });
      let label = null;
      if (h >= 18) label = el('text', { x: xc(g), y: top + h / 2 + 4, 'text-anchor': 'middle', class: 'seg-label', fill: s.text || '#FFFFFF' }, v);
      segs.push({ el: rect, label: label });
      rect.addEventListener('mouseenter', () => showTip(rect, label, g, k));
      rect.addEventListener('focus', () => showTip(rect, label, g, k));
      rect.addEventListener('click', () => showTip(rect, label, g, k));
      rect.addEventListener('mouseleave', hideTip);
      rect.addEventListener('blur', hideTip);
      base += v;
    });
    el('text', { x: xc(g), y: y(totals[g]) - 8, 'text-anchor': 'middle', class: 'total' }, totals[g]);
  });
}

function showTip(rect, label, g, k) {
  const s = series[k], v = s.values[g];
  const pct = totals[g] ? Math.round(v / totals[g] * 100) : 0;
  tip.innerHTML = '<div class="name"><i style="background:' + s.color + '"></i>' + s.name + '</div>' +
    '<div class="meta">' + groups[g] + '</div><div class="val">' + v + '<small>' + unit + '</small></div>' +
    '<div class="meta">' + pct + '% of ' + totals[g] + ' total</div>';
  svg.classList.add('dim');
  rect.classList.add('on'); if (label) label.classList.add('on');
  tip.classList.add('show');
  const box = wrap.getBoundingClientRect(), r = rect.getBoundingClientRect();
  let left = r.right - box.left + 10;
  if (left + tip.offsetWidth > box.width - 4) left = r.left - box.left - tip.offsetWidth - 10;
  let top = r.top - box.top + r.height / 2 - tip.offsetHeight / 2;
  top = Math.max(0, Math.min(top, box.height - tip.offsetHeight));
  tip.style.left = Math.max(4, left) + 'px'; tip.style.top = top + 'px';
}
function hideTip() {
  tip.classList.remove('show');
  svg.classList.remove('dim');
  segs.forEach(o => { o.el.classList.remove('on'); if (o.label) o.label.classList.remove('on'); });
}

draw();
window.addEventListener('resize', draw);
</script>
</body>
</html>
